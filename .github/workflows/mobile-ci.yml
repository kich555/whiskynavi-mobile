name: Mobile quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:e2e:validate
      - run: npx expo-doctor
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: |
            .e2e-dist
            .e2e-dist-cache.json
          key: e2e-web-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src/**', 'assets/**', 'app*', 'metro.config.js', 'scripts/web-e2e.mjs', 'scripts/e2e-cache.mjs') }}
      - run: npm run test:e2e:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-fixture-test-results
          path: artifacts/
          retention-days: 7
  android-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: artifacts/native-build
          key: android-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src/**', 'assets/**', 'app*', 'metro.config.js', 'scripts/native-e2e.mjs', 'scripts/e2e-cache.mjs', 'scripts/web-e2e.mjs') }}
      - name: Build Android without competing emulator load
        run: npm run test:e2e:android -- --build-only --arch=x86_64
      - name: Test Android release app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: npm run test:e2e:android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-fixture-test-results
          path: |
            artifacts/maestro.xml
            artifacts/maestro-debug/
            artifacts/maestro/
            artifacts/native-summary.json
          retention-days: 7
