appId: ${APP_ID}
name: Shopping channels and mobile product detail
onFlowComplete:
  - runScript: helpers/cleanup.js
---
- runScript: helpers/reset.js
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: WHISKYNAVI
    timeout: 20000
- openLink: whiskynavi-e2e://shop
- extendedWaitUntil:
    visible: 일반상품
    timeout: 15000
- scrollUntilVisible:
    element:
      id: product-card-1
    direction: DOWN
- assertVisible:
    id: product-card-1
- scrollUntilVisible:
    element: 이용권
    direction: UP
- tapOn: 이용권
- scrollUntilVisible:
    element:
      id: product-card-2
    direction: DOWN
- assertVisible:
    id: product-card-2
- scrollUntilVisible:
    element: 스마트오더
    direction: UP
- tapOn: 스마트오더
- scrollUntilVisible:
    element:
      id: product-card-3
    direction: DOWN
- assertVisible:
    id: product-card-3
- takeScreenshot: artifacts/shopping-channels
- tapOn:
    id: product-card-3
- extendedWaitUntil:
    visible: 매장 픽업 위스키
    timeout: 15000
- scrollUntilVisible:
    element: 픽업 주문하기
    direction: DOWN
- assertVisible: 픽업 주문하기
- takeScreenshot: artifacts/shopping-smart-detail
